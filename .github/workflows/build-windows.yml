name: Windows installer
# 0.91.57: the installer of «Азимут» for Windows — PyInstaller (packaging/azimuth.spec) and Inno Setup
# (packaging/azimuth.iss). Started by hand (Actions → Windows installer → Run workflow) or by a tag v*;
# the result is the artifact «Azimuth-Setup-<version>» of the run.
# 0.166.0: unsigned while the secrets WINDOWS_CERT_PFX (the code signing certificate, .pfx in base64) and
# WINDOWS_CERT_PASSWORD are not set; with them Azimuth.exe and the installer are signed (signtool, timestamp).
on:
  workflow_dispatch:
    inputs:
      release:
        description: 'The tag of the release to add the files to (v0.222.50); empty — the files stay in the run only'
        required: false
        default: ''
  push:
    tags: ['v*']
jobs:
  build:
    permissions:
      contents: write  # the release of a tag
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYTHONIOENCODING: utf-8
      WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Libraries
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller==6.16.0
      - name: Version
        id: version
        run: |
          $v = python -c "import azimuth; print(azimuth.__version__)"
          "version=$v" >> $env:GITHUB_OUTPUT
      - name: PyInstaller
        run: pyinstaller --noconfirm --clean packaging/azimuth.spec
      # 0.108.30 (the review of 2026-11-09, §20): this check is required — an installer is not built when the program
      # does not start. It runs without VTK (AZIMUTH_NO_VTK): the built-in view is checked, the VTK view of Compass is
      # NOT checked here (the next step says so in the summary of the run).
      - name: Check that the program starts (the hub, the Atlas server and every section; without VTK)
        env:
          QT_QPA_PLATFORM: offscreen
          AZIMUTH_NO_VTK: '1'
          AZIMUTH_LOG_DIR: ${{ runner.temp }}\azimuth-logs
        run: |
          $p = Start-Process -FilePath dist\Azimuth\Azimuth.exe -ArgumentList '--check' -PassThru -Wait -NoNewWindow
          Get-Content "$env:AZIMUTH_LOG_DIR\startup.log" -ErrorAction SilentlyContinue
          Get-Content "$env:AZIMUTH_LOG_DIR\errors.log" -ErrorAction SilentlyContinue
          Get-Content "$env:AZIMUTH_LOG_DIR\crash.log" -ErrorAction SilentlyContinue
          exit $p.ExitCode
      - name: What was not checked
        run: |
          "Not checked by this build: the VTK view of Compass (the start was checked with AZIMUTH_NO_VTK), an installation on a clean machine, calculations by external programs." >> $env:GITHUB_STEP_SUMMARY
      - name: Certificate (only when the secrets are set)
        if: env.WINDOWS_CERT_PFX != ''
        run: |
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\cert.pfx", [Convert]::FromBase64String($env:WINDOWS_CERT_PFX))
          $tool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1
          "SIGNTOOL=$($tool.FullName)" >> $env:GITHUB_ENV
      - name: Sign Azimuth.exe
        if: env.WINDOWS_CERT_PFX != ''
        env:
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          & $env:SIGNTOOL sign /f "$env:RUNNER_TEMP\cert.pfx" /p $env:WINDOWS_CERT_PASSWORD /fd sha256 /tr http://timestamp.digicert.com /td sha256 dist\Azimuth\Azimuth.exe
      - name: Inno Setup
        run: |
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.version.outputs.version }}" packaging\azimuth.iss
      - name: Sign the installer
        if: env.WINDOWS_CERT_PFX != ''
        env:
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          & $env:SIGNTOOL sign /f "$env:RUNNER_TEMP\cert.pfx" /p $env:WINDOWS_CERT_PASSWORD /fd sha256 /tr http://timestamp.digicert.com /td sha256 (Get-ChildItem dist\installer\*.exe).FullName
      - name: SHA-256
        run: |
          Get-ChildItem dist\installer\*.exe | ForEach-Object { "$((Get-FileHash $_ -Algorithm SHA256).Hash.ToLower())  $($_.Name)" | Out-File -Encoding ascii "$($_.FullName).sha256" }
      - uses: actions/upload-artifact@v4
        with:
          name: Azimuth-Setup-${{ steps.version.outputs.version }}
          path: |
            dist/installer/*.exe
            dist/installer/*.sha256
          retention-days: 30
      # The release of GitHub (only for a tag v*): the installer under its own name and under the name without the
      # version Azimuth-Setup-Windows-x64.exe — the button of the site (site/index.html, «Скачать») leads to
      # releases/latest/download/Azimuth-Setup-Windows-x64.exe. The two builds add their files to the same release; the one that comes
      # first makes it, with the words of packaging/release_notes.md.
      - name: Release (a tag v*, or the tag given to a run by hand)
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ inputs.release || github.ref_name }}"
          files=(dist/installer/Azimuth-Setup-*.exe dist/installer/Azimuth-Setup-*.exe.sha256)
          cp "${files[0]}" "dist/installer/Azimuth-Setup-Windows-x64.exe"
          sed "s/{version}/${tag#v}/g" packaging/release_notes.md > release-notes.md
          gh release view "$tag" > /dev/null 2>&1 || \
            gh release create "$tag" --verify-tag --title "Азимут ${tag#v}" --notes-file release-notes.md || true
          gh release upload "$tag" "${files[@]}" "dist/installer/Azimuth-Setup-Windows-x64.exe" --clobber
