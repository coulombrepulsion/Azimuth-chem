name: Cross-platform tests
# 0.222.26: started by hand (Actions → Cross-platform tests → Run workflow), not on every push — the included minutes of a
# private repository ran out (2026-11-23); a minute of macOS costs about ten of Linux. macOS is left out: the full run
# goes on the owner's Mac before every commit (tools/test.py full)
on: [workflow_dispatch]
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      QT_QPA_PLATFORM: offscreen
      # 0.91.57: the Windows machines of GitHub have no OpenGL: the probe of VTK fell with an access violation
      # 0.194.0: Linux the same — no display and no GPU there; the VTK view on Linux is checked by hand
      AZIMUTH_NO_VTK: ${{ matrix.os != 'macos-latest' && '1' || '' }}
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      # 0.194.0: the libraries Qt loads even offscreen (EGL, xkbcommon, fontconfig, D-Bus); the runner may lack some
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q -rf --tb=short -p no:cacheprovider
