name: Cross-platform tests
# In the public repository (coulombrepulsion/Azimuth-chem) on every push and pull request: there the minutes of GitHub
# are free, macOS included. In the private one only by hand (Actions → Cross-platform tests → Run workflow): its
# included minutes ran out (2026-11-23), and a minute of macOS costs about ten of Linux — a push there makes a skipped
# run that costs nothing.
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
jobs:
  tests:
    if: github.event_name == 'workflow_dispatch' || github.repository == 'coulombrepulsion/Azimuth-chem'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      QT_QPA_PLATFORM: offscreen
      # the machines of GitHub have no GPU: the 3D view of VTK is not probed there (0.91.57 — an access violation on
      # Windows; Linux and macOS the same); VTK is checked on the owner's Mac
      AZIMUTH_NO_VTK: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      # the libraries Qt loads even offscreen (EGL, xkbcommon, fontconfig, D-Bus); the runner may lack some
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: python -m pip install -r requirements-dev.txt
      # the whole set as on the owner's Mac, in three pytest processes (the runners have three or four cores)
      - run: python tools/test.py full --jobs 3
      # the failed tests as annotations of the run: seen on its page and through the API without signing in
      - if: failure()
        shell: bash
        run: |
          python - <<'PY'
          import glob, xml.etree.ElementTree as ET
          def say(title, text):
              text = text.replace('%', '%25').replace('\r', '').replace('\n', '%0A')
              title = title.replace('%', '%25').replace(':', '%3A').replace(',', '%2C')
              print(f'::error title={title}::{text}')
          failed = []
          for path in sorted(glob.glob('artifacts/tests/*/junit.xml')):
              for case in ET.parse(path).iter('testcase'):
                  for bad in list(case.findall('failure')) + list(case.findall('error')):
                      name = case.get('classname', '') + '::' + case.get('name', '')
                      failed.append((name, (bad.get('message') or '') + '\n' + (bad.text or '')[-1500:]))
          if failed:
              say(f'{len(failed)} failed', '\n'.join(name for name, _ in failed[:80]))
              for name, text in failed[:8]:
                  say(name[-120:], text[:3000])
          else:
              logs = sorted(glob.glob('artifacts/tests/*/log.txt'))
              tail = open(logs[-1], encoding='utf-8', errors='replace').read()[-3000:] if logs else 'no report'
              say('no junit report', tail)
          PY
      # the report of the run (log, junit.xml) when something failed
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tests-${{ matrix.os }}
          path: artifacts/tests/
          retention-days: 14
